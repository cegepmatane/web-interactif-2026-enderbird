<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎟️ Le Gratteux Magique</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Luckiest Guy', cursive;
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        .particules {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particule {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: flottement-particule 8s infinite;
        }

        @keyframes flottement-particule {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        .conteneur {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-family: 'Bungee Shade', cursive;
            font-size: 2.5em;
            color: white;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.3);
        }

        .sous-titre {
            color: white;
            font-size: 1.1em;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .cadre-gratteux {
            background: linear-gradient(135deg, #feca57 0%, #ff9f43 100%);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 8px solid #e17055;
            margin: 20px auto;
            max-width: 500px; /* Format 4x5 */
        }

        .grille-gratteux {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 2px;
            background: #2d3436;
            padding: 2px;
            border-radius: 10px;
            aspect-ratio: 4 / 5;
        }

        .case-gratteux {
            background: #dfe6e9; /* Fond révélé (clair) */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        /* LA COUCHE DE PEINTURE AVEC LE DESSIN SUR LE DESSUS */
        .case-gratteux::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Ton image de peinture */
            background-image: url('https://picsum.photos/400/500?grayscale');
            background-size: 400% 500%; /* Important pour que l'image couvre toute la grille */
            border: 1px solid rgba(0,0,0,0.1);
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 2;
        }

        /* Ajustement de la position de l'image pour chaque case pour recréer le dessin global */
        /* (Optionnel : si tu veux un seul grand dessin sur toute la grille) */
        .case-gratteux.grattee::after {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        .case-gratteux.gagnante {
            background: linear-gradient(135deg, #fdcb6e 0%, #f39c12 100%);
            animation: brillance 1s ease-in-out infinite alternate;
        }

        @keyframes brillance {
            0% { box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.5); }
            100% { box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.9); }
        }

        .statistiques {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .boite-statistique {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            min-width: 150px;
        }

        .etiquette-statistique {
            font-size: 0.85em;
            color: #636e72;
            margin-bottom: 5px;
        }

        .valeur-statistique {
            font-size: 1.6em;
            color: #e17055;
        }

        #zone-message {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 20px;
            margin: 20px auto;
            font-size: 1.2em;
            color: #2d3436;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
        }

        .zone-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .action {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1em;
            font-family: 'Luckiest Guy', cursive;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 184, 148, 0.4);
            transition: all 0.3s;
            border: 3px solid white;
        }

        .action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .navigation {
            margin-top: 20px;
        }

        .navigation a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="particules" id="univers-particules"></div>

    <div class="conteneur">
        <h1>🎟️ LE GRATTEUX MAGIQUE</h1>
        <p class="sous-titre">Grattez le dessin pour révéler vos symboles !</p>

        <div class="statistiques">
            <div class="boite-statistique">
                <div class="etiquette-statistique">Cases grattées</div>
                <div class="valeur-statistique"><span id="cases-grattees">0</span> / 20</div>
            </div>
            <div class="boite-statistique">
                <div class="etiquette-statistique">Gain potentiel</div>
                <div class="valeur-statistique" id="gain-potentiel">0$</div>
            </div>
        </div>

        <div class="cadre-gratteux">
            <div class="grille-gratteux" id="grille-gratteux"></div>
        </div>

        <div id="zone-message">
            👆 Grattez l'image pour découvrir si vous avez gagné !
        </div>

        <div class="zone-actions">
            <button class="action" id="action-nouveau">🔄 Nouveau Gratteux</button>
            <button class="action" id="action-reclamer" disabled style="background: #fdcb6e; color: #2d3436;">💰 Réclamer</button>
        </div>

        <div class="navigation">
            <a href="03-fortune-cookies.html">← Biscuits</a>
            <a href="../index.html">🏠 Accueil</a>
        </div>
    </div>

    <script>
        // === CONFIGURATION ===
        var nombreColonnes = 4;
        var nombreLignes = 5;
        var nombreCases = nombreColonnes * nombreLignes;

        var grilleGratteux = document.getElementById('grille-gratteux');
        var zoneMessage = document.getElementById('zone-message');
        var actionNouveau = document.getElementById('action-nouveau');
        var actionReclamer = document.getElementById('action-reclamer');
        var affichageCasesGrattees = document.getElementById('cases-grattees');
        var affichageGainPotentiel = document.getElementById('gain-potentiel');

        var requeteAjax = null;
        var estEnTrainDeGratter = false;

        function lancerParticules() {
            var conteneur = document.getElementById('univers-particules');
            for (var no = 0; no < 40; no++) {
                var particule = document.createElement('div');
                particule.className = 'particule';
                particule.style.left = Math.random() * 100 + '%';
                particule.style.animationDelay = Math.random() * 8 + 's';
                conteneur.appendChild(particule);
            }
        }

        function initialiserGrille() {
            grilleGratteux.innerHTML = '';
            for (var noCase = 0; noCase < nombreCases; noCase++) {
                var vueCase = document.createElement('div');
                vueCase.className = 'case-gratteux';
                vueCase.setAttribute('data-position', noCase);

                // Positionnement de l'image sur chaque case pour l'effet "un seul dessin"
                var colonne = noCase % nombreColonnes;
                var ligne = Math.floor(noCase / nombreColonnes);
                vueCase.style.setProperty('--x', (colonne * 100 / (nombreColonnes - 1)) + '%');
                vueCase.style.setProperty('--y', (ligne * 100 / (nombreLignes - 1)) + '%');

                // Injection dynamique du style pour le background-position
                var style = document.createElement('style');
                style.innerHTML = `.case-gratteux[data-position="${noCase}"]::after { background-position: ${(colonne * 33.33)}% ${(ligne * 25)}%; }`;
                document.head.appendChild(style);

                vueCase.addEventListener('mousedown', demarrerGrattage);
                vueCase.addEventListener('mouseenter', continuerGrattage);
                grilleGratteux.appendChild(vueCase);
            }
            document.addEventListener('mouseup', arreterGrattage);
        }

        function demarrerGrattage(e) { e.preventDefault(); estEnTrainDeGratter = true; gratterCase(e.currentTarget); }
        function continuerGrattage(e) { if (estEnTrainDeGratter) gratterCase(e.currentTarget); }
        function arreterGrattage() { estEnTrainDeGratter = false; }

        function gratterCase(carre) {
            if (carre.classList.contains('grattee')) return;
            var position = carre.getAttribute('data-position');
            envoyerRequeteGrattage(position);
        }

        function afficherCaseGrattee(xml) {
            var caseXml = xml.getElementsByTagName('case-grattee')[0];
            if (caseXml) {
                var position = caseXml.getAttribute('position');
                var symbole = caseXml.getElementsByTagName('symbole')[0].textContent;
                var cases = grilleGratteux.querySelectorAll('.case-gratteux');
                var cible = cases[parseInt(position)];
                cible.classList.add('grattee');
                cible.textContent = symbole;
            }

            var gains = xml.getElementsByTagName('etat-gains')[0];
            affichageCasesGrattees.textContent = gains.getElementsByTagName('cases-grattees')[0].textContent;
            affichageGainPotentiel.textContent = gains.getElementsByTagName('gain-potentiel')[0].textContent + '$';
            zoneMessage.textContent = gains.getElementsByTagName('message')[0].textContent;

            if (gains.getElementsByTagName('gain-confirme')[0].textContent === 'true') {
                actionReclamer.disabled = false;
            }
        }

        function envoyerRequeteGrattage(position) {
            requeteAjax = new XMLHttpRequest();
            requeteAjax.open('POST', 'le-gratteux.php', true);
            requeteAjax.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            requeteAjax.onreadystatechange = function() {
                if (requeteAjax.readyState === 4 && requeteAjax.status === 200) {
                    afficherCaseGrattee(requeteAjax.responseXML);
                }
            };
            requeteAjax.send('action=gratter&position=' + position);
        }

        function reinitialiserGrille() {
            initialiserGrille();
            affichageCasesGrattees.textContent = '0';
            affichageGainPotentiel.textContent = '0$';
            actionReclamer.disabled = true;
        }

        actionNouveau.addEventListener('click', function() {
            requeteAjax = new XMLHttpRequest();
            requeteAjax.open('GET', 'le-gratteux.php?action=nouveau', true);
            requeteAjax.onreadystatechange = function() {
                if (requeteAjax.readyState === 4) {
                    reinitialiserGrille();
                }
            };
            requeteAjax.send();
        });

        // Initialisation
        lancerParticules();
        initialiserGrille();
    </script>
</body>
</html>
